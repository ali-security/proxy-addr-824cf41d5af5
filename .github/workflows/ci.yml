name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional node --test name pattern; empty runs the full suite'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://:2025-09-28T15%3A18%3A44.994Z@time-machines-npm.sealsecurity.io/

jobs:
  license-check:
    name: Check Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Check Licenses
        run: npx license-checker --production --summary --onlyAllow="0BSD;Apache-2.0;BlueOak-1.0.0;BSD-2-Clause;BSD-3-Clause;ISC;MIT;"

  linter:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Lint code
        run: npm run lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Run tests
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            node --test --test-name-pattern "$TEST_FILTER"
          else
            npm test
          fi

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Pin npm to the publisher's version
        run: npm i -g npm@10.9.3

      - name: Pack
        run: |
          npm pack
          mv fastify-proxy-addr-5.1.0.tgz proxy-addr-5.1.0.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: proxy-addr-tgz
          path: proxy-addr-5.1.0.tgz
          if-no-files-found: error
